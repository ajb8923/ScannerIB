<style>
:root{--bg:#060d1a;--card:#0b1527;--bd:#1b2a44;--tx:#dbe4f0;--mu:#7f8ea8;--up:#22c55e;--dn:#ef4444;--am:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px -apple-system,system-ui,sans-serif;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
h1{font-size:18px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input,button,.btn{background:#0a1322;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font-size:14px}
input[type=number]{width:68px}
button,.btn{cursor:pointer}
button.on{border-color:var(--am);color:var(--am)}
.tg{display:flex;align-items:center;gap:5px;color:var(--mu)}
#wrap{position:relative;height:480px}
#chart{position:absolute;inset:0;z-index:0}
#ov{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.leg{font-size:12px;color:var(--mu);padding:4px 6px 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.leg b{font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{color:var(--mu);font-size:12px;line-height:1.6}.v{font-size:20px;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 5px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500}
tr.c{cursor:pointer}tr.sel{background:#13213a}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.am{color:var(--am)}
#edit{display:none;border-color:var(--am)}
.spin{display:inline-block;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#13213a;border:1px solid var(--bd);
  color:var(--tx);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:40;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 12px 16px}
.modal.show{display:block}
.mbox{max-width:900px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.svgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.svgs svg{width:100%;height:auto;display:block;border-radius:10px}
</style></head><body>

</div>
<div class="card" id="edit"></div>

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!window.LightweightCharts){document.getElementById('today').innerHTML='<span style="color:#ef4444">No se pudo cargar el gráfico. Abre la app una vez con conexión para que se guarde en el iPad.</span>';throw new Error('sin librería')}
const $=id=>document.getElementById(id);
let D,HIST={},S,G=[],R=[],TR=[],CUR={},day=0,selTr=null,selId=null,drag=null,justDragged=0,boxes=[],sig='',addMode=null,busy=false;
let OV={},MAN={};
try{OV=JSON.parse(localStorage.getItem('ibOverrides')||'{}')}catch(e){}
try{MAN=JSON.parse(localStorage.getItem('ibManual')||'{}')}catch(e){}
function saveAll(){try{localStorage.setItem('ibOverrides',JSON.stringify(OV));localStorage.setItem('ibManual',JSON.stringify(MAN))}catch(e){}
  $('nov').textContent=Object.keys(OV).length+' ajustes · '+Object.keys(MAN).length+' propias'}
const hhmm=t=>new Date(t*1000).toISOString().slice(11,16);
const f=x=>x==null?'–':(+x).toFixed(1);
const sgn=x=>(x>0?'+':'')+x;
const lonNow=()=>{const d=new Date(),s=d.toLocaleString('sv-SE',{timeZone:'Europe/London'});return Date.parse(s.replace(' ','T')+'Z')/1000};
const pts=t=>t.x==null?null:(t.d==='L'?t.x-t.e:t.e-t.x);
const SETN={A:'A',B:'B',C:'C',D:'D',O:'Otro'};
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

const wrap=$('wrap'),cv=$('ov'),ctx=cv.getContext('2d');
const chart=LightweightCharts.createChart($('chart'),{autoSize:true,
  layout:{background:{type:'solid',color:'#060d1a'},textColor:'#cbd5e1'},
  grid:{vertLines:{color:'#101b30'},horzLines:{color:'#101b30'}},
  timeScale:{timeVisible:true,secondsVisible:false,borderColor:'#1b2a44',rightOffset:6},
  rightPriceScale:{borderColor:'#1b2a44'},crosshair:{mode:0}});
const cs=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const vw=chart.addLineSeries({color:'#a78bfa',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});

function cfg(){return{A:$('fA').checked,B:$('fB').checked,C:$('fC').checked,D:$('fD').checked,long:$('fL').checked,short:$('fS').checked,
  news:$('fN').checked,atr_mult:+$('am').value,rr:+$('rr').value,ib_min:+$('ib').value,gap:+$('gap').value,useOv:$('fO').checked,man:$('fM').checked}}
const passes=(t,c)=>(t.st==='O'||c[t.st])&&(t.d==='L'?c.long:c.short);

function atr(b,n){const o=[],tr=[];let s=0;
  for(let i=0;i<b.length;i++){const pc=i?b[i-1][4]:b[i][4];
    const t=Math.max(b[i][2]-b[i][3],Math.abs(b[i][2]-pc),Math.abs(b[i][3]-pc));
    tr.push(t);s+=t;if(i>=n)s-=tr[i-n];o.push(i>=n-1?s/n:null)}return o}

function closeTr(p,px,why,t){p.x=px;p.why=why;p.xt=t;p.r=(p.d==='L'?px-p.e:p.e-px)/p.risk}

function runDay(day,A,c,openM,live,key){
  const ibe=openM+c.ib_min,ib=day.filter(x=>x[1][5]<ibe).map(x=>x[1]);
  if(!ib.length)return null;
  const H=Math.max(...ib.map(b=>b[2])),L=Math.min(...ib.map(b=>b[3])),M=(H+L)/2;
  const k0=day.findIndex(x=>x[1][5]>=ibe),res={H,L,M,trades:[],pending:null,ibOk:k0>=0};
  if(k0<0)return res;
  let pos=null,up=false,dn=false;
  for(let k=k0;k<day.length;k++){
    const [gi,b]=day[k],pc=day[k-1][1][4];
    if(pc>H)up=true;if(pc<L)dn=true;
    if(pos){if(k>=pos.k){const lg=pos.d==='L';
        if(lg?b[3]<=pos.sl:b[2]>=pos.sl){closeTr(pos,pos.sl,'stop',b[0]);pos=null}
        else if(lg?b[2]>=pos.tp:b[3]<=pos.tp){closeTr(pos,pos.tp,'objetivo',b[0]);pos=null}}
      continue}
    const a=gi?A[gi-1]:null;
    if(c.news&&a&&b[2]-b[3]>c.atr_mult*a)continue;
    const cl=b[4];let st=null,d=null;
    if(c.A&&cl>H&&pc<=H){st='A';d='L'}
    else if(c.A&&cl<L&&pc>=L){st='A';d='S'}
    else if(c.B&&up&&cl<H&&pc>=H&&cl>M){st='B';d='S'}
    else if(c.B&&dn&&cl>L&&pc<=L&&cl<M){st='B';d='L'}
    else if(c.C&&b[2]>=H&&cl<H&&cl<b[1]){st='C';d='S'}
    else if(c.C&&b[3]<=L&&cl>L&&cl>b[1]){st='C';d='L'}
    else if(c.D){const pv=day.slice(Math.max(0,k-6),k).map(x=>x[1][4]);
      if(b[3]<=M&&cl>M&&cl>b[1]&&pv.some(p=>p>M)){st='D';d='L'}
      else if(b[2]>=M&&cl<M&&cl<b[1]&&pv.some(p=>p<M)){st='D';d='S'}}
    if(!st||(d==='L'?!c.long:!c.short))continue;
    const nx=k+1<day.length?day[k+1][1]:null;
    if(!nx&&!live)continue;
    const e=nx?nx[1]:cl;
    if(st==='A'&&nx&&(d==='L'?e<H+c.gap:e>L-c.gap))continue;
    const sl0=d==='L'?b[3]:b[2],risk0=d==='L'?e-sl0:sl0-e;
    if(risk0<=0)continue;
    let tp0;
    if(st==='A')tp0=d==='L'?e+c.rr*risk0:e-c.rr*risk0;
    else{tp0=(st==='D')?(d==='L'?H:L):M;if(d==='L'?tp0<=e:tp0>=e)continue}
    const id=`${key}|${b[0]}|${st}${d}`;
    let sl=sl0,tp=tp0,risk=risk0,ov=false;
    if(nx&&c.useOv&&OV[id]){const o=OV[id],r2=d==='L'?e-o.sl:o.sl-e,okT=d==='L'?o.tp>e:o.tp<e;
      if(r2>0&&okT){sl=o.sl;tp=o.tp;risk=r2;ov=true}}
    const t={id,st,d,sig_t:b[0],e,sl,tp,risk,sl0,tp0,ov,k:k+1,et:nx?nx[0]:null,x:null};
    if(nx){res.trades.push(t);pos=t}else res.pending=t;
  }
  if(pos&&!live){const lb=day[day.length-1][1];closeTr(pos,lb[4],'cierre',lb[0])}
  return res}

// Operación propia: se simula vela a vela desde la vela de entrada (o se usa la salida que escribas)
function simMan(m,g,live){
  const t={id:m.id,man:true,st:m.st||'O',d:m.d,sig_t:m.t,et:m.t,e:m.e,sl:m.sl,tp:m.tp,risk:Math.abs(m.e-m.sl),sl0:m.sl,tp0:m.tp,x:null,date:m.date};
  if(m.xm!=null&&m.xm!==''){closeTr(t,+m.xm,'manual',m.t);return t}
  const k=g?g.findIndex(x=>x[1][0]===m.t):-1;
  if(k<0){if(m.snap)Object.assign(t,m.snap);return t}
  for(let j=k+1;j<g.length;j++){const b=g[j][1],lg=t.d==='L';
    if(lg?b[3]<=t.sl:b[2]>=t.sl){closeTr(t,t.sl,'stop',b[0]);return t}
    if(lg?b[2]>=t.tp:b[3]<=t.tp){closeTr(t,t.tp,'objetivo',b[0]);return t}}
  if(!live){const lb=g[g.length-1][1];closeTr(t,lb[4],'cierre',lb[0])}
  return t}

function vwapData(){const out=[];
  G.forEach(g=>{const tot=g.reduce((a,x)=>a+(x[1][7]||0),0);let pv=0,vv=0,ps=0,n=0;
    g.forEach((x,i)=>{const b=x[1],tp=(b[2]+b[3]+b[4])/3,v=b[7]||0;pv+=tp*v;vv+=v;ps+=tp;n++;
      out.push(i===0?{time:b[0]}:{time:b[0],value:tot>0&&vv>0?pv/vv:ps/n})})});
  return out}

function stats(t){const n=t.length,w=t.filter(x=>x.r>0),l=t.filter(x=>x.r<0);
  const sum=t.reduce((a,x)=>a+x.r,0),gp=w.reduce((a,x)=>a+x.r,0),gl=-l.reduce((a,x)=>a+x.r,0);
  const pt=t.reduce((a,x)=>a+(pts(x)||0),0);
  let eq=0,pk=0,dd=0;t.forEach(x=>{eq+=x.r;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)});
  return{n,wr:n?w.length/n*100:0,sum,avg:n?sum/n:0,pf:gl?gp/gl:(gp?Infinity:0),dd,pt}}

function box(name,t){const s=stats(t);

function pick(reset){

  S=D.symbols[$('sym').value];S.key=$('sym').value;
  G=S.days.map(()=>[]);S.bars.forEach((b,gi)=>G[b[6]].push([gi,b]));

  $('vwl').textContent=S.bars.some(b=>b[7]>0)?'VWAP':'VWAP (sin volumen: media de precio)';

function isLive(di){const g=G[di];if(!g||!g.length)return false;const lb=g[g.length-1][1];
  return di===S.days.length-1&&lb[5]<S.close-5&&lonNow()-lb[0]<7200}

function compute(){
  CUR=cfg();
  R=G.map((g,di)=>g.length?runDay(g,S.A,CUR,S.open,isLive(di),S.key):null);
  TR=[];R.forEach((r,di)=>r&&r.trades.forEach(t=>{t.di=di;t.date=S.days[di];TR.push(t)}));
  // Días antiguos: solo historial del scanner (sin velas)
  const H0=HIST[S.key]||{};
  Object.keys(H0).filter(d=>!S.days.includes(d)).forEach(d=>H0[d].trades.forEach(h=>{
    const t=Object.assign({},h,{di:-1,date:d,sl0:h.sl,tp0:h.tp,ov:false});
    if(!passes(t,CUR))return;
    const o=OV[t.id];if(CUR.useOv&&o&&o.snap){Object.assign(t,o.snap);t.ov=true}
    TR.push(t)}));
  // Operaciones propias
  if(CUR.man)Object.values(MAN).filter(m=>m.sym===S.key).forEach(m=>{
    const di=S.days.indexOf(m.date),t=simMan(m,di>=0?G[di]:null,di>=0&&isLive(di));t.di=di;
    if(!passes(t,CUR))return;
    TR.push(t);if(di>=0){if(!R[di])R[di]={H:null,trades:[]};R[di].trades.push(t)}});
  TR.sort((a,b)=>(a.et||a.sig_t)-(b.et||b.sig_t));
  // Guardar el resultado de cada operación ajustada o propia, para cuando sus velas desaparezcan
  TR.forEach(t=>{if(t.x==null||t.di<0)return;const snap={x:t.x,xt:t.xt,why:t.why,r:t.r,tp:t.tp,sl:t.sl,e:t.e,risk:t.risk};
    if(t.man&&MAN[t.id])MAN[t.id].snap=snap;else if(t.ov&&OV[t.id])OV[t.id].snap=snap});
  selTr=selId?TR.find(t=>t.id===selId)||null:null;if(!selTr)selId=null;
  const mk=[];
  R.forEach(r=>{if(!r)return;r.trades.forEach(t=>{
      mk.push({time:t.et,position:t.d==='L'?'belowBar':'aboveBar',color:t.d==='L'?'#22c55e':'#ef4444',shape:t.d==='L'?'arrowUp':'arrowDown',text:t.man?'✋'+(t.st==='O'?'':t.st):t.st});
      if(t.xt&&t.why!=='manual')mk.push({time:t.xt,position:t.d==='L'?'aboveBar':'belowBar',color:t.r>0?'#22c55e':'#ef4444',shape:'circle',text:(t.r>0?'+':'')+t.r.toFixed(1)+'R'})});
    if(r.pending)mk.push({time:r.pending.sig_t,position:'aboveBar',color:'#f59e0b',shape:'circle',text:'señal'})});
  mk.sort((a,b)=>a.time-b.time);cs.setMarkers(mk);
  vw.applyOptions({visible:$('fV').checked});
  saveAll();renderToday();renderStats();renderTable();renderEdit();sig=''}

function line(x1,x2,y,c,dash){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.setLineDash([])}

  ctx.fillStyle='rgba(6,13,26,0.85)';ctx.fillRect(x+2,yy,w,17);ctx.strokeStyle=c;ctx.lineWidth=1;ctx.strokeRect(x+2,yy,w,17);

function drawPos(t,g,X,Y,bs){

  const xa=xe-bs,xb=Math.max(xx+bs,xa+3*bs),ye=Y(t.e),yt=Y(tp),ys=Y(sl);
  if(ye==null||yt==null||ys==null)return;
  ctx.fillStyle=sel?'rgba(34,197,94,0.30)':'rgba(34,197,94,0.14)';ctx.fillRect(xa,Math.min(ye,yt),xb-xa,Math.abs(yt-ye));
  ctx.fillStyle=sel?'rgba(239,68,68,0.30)':'rgba(239,68,68,0.14)';ctx.fillRect(xa,Math.min(ye,ys),xb-xa,Math.abs(ys-ye));
  line(xa,xb,ye,'#e2e8f0',[]);

function paint(){

  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);boxes=[];if(!S)return;

  BG();T('Scanner IB · '+S.label,14,18,{s:18,b:1});T(`Informe del ${from} al ${to} · ${days.length} sesiones · ${CUR.useOv?'con ajustes manuales':'regla fija'}${CUR.man?' · incluye mis operaciones':''}`,14,26,{c:MU,s:10});
  const cols=[14,74,96,120,144,170,192,216,246];let y=40;
  ['Grupo','Ops','Acierto','R total','R medio','PF','DD máx','Puntos'].forEach((h,i)=>T(h,cols[i],y,{c:BL,b:1}));y+=7;
  groups(trs).forEach(([n,t])=>{const s=stats(t);T(n.replace(' ✋',''),cols[0],y);T(s.n,cols[1],y);T(s.wr.toFixed(0)+'%',cols[2],y);
    T(sgn(s.sum.toFixed(1))+'R',cols[3],y,{c:s.sum>=0?GR:RD});T(s.avg.toFixed(2),cols[4],y);T(isFinite(s.pf)?s.pf.toFixed(2):'-',cols[5],y);
    T(s.dd.toFixed(1)+'R',cols[6],y);T(sgn(s.pt.toFixed(1)),cols[7],y,{c:s.pt>=0?GR:RD});y+=7});
  // Una página por día
  const keepDay=day,keepSel=selId;select(null);
  for(let i=0;i<days.length;i++){const d=days[i];$('pProg').textContent=`Día ${i+1} de ${days.length}…`;
    doc.addPage();BG();const di=S.days.indexOf(d),r=di>=0?R[di]:null,hd=(HIST[S.key]||{})[d];
    const ib=r&&r.H!=null?r:hd;
    T(`${S.label} · ${d}`,14,14,{s:14,b:1});
    if(ib)T(`IB H ${f(ib.H)}   ·   50% ${f(ib.M)}   ·   IB L ${f(ib.L)}`,283,14,{r:1,c:BL,s:10});
    let yy=20;
    if(di>=0){goDay(di);await frames();paint();const im=shot();const ih=Math.min(118,269*im.h/im.w);doc.addImage(im.url,'JPEG',14,yy,269*Math.min(1,118/(269*im.h/im.w)),ih);yy+=ih+8}
    else{T('Sin gráfico: las velas de este día ya no están disponibles (más de 60 días).',14,yy+6,{c:MU});yy+=14}
    const dt=TR.filter(t=>t.date===d);
    const c2=[14,34,64,84,110,136,162,188,214,240,266];
    ['Hora','Setup','Dir.','Entrada','Stop','Objetivo','Salida','Precio','Puntos','R'].forEach((h,j)=>T(h,c2[j],yy,{c:BL,b:1}));yy+=6;
    if(!dt.length){T('Sin operaciones',14,yy,{c:MU});yy+=6}
    dt.forEach(t=>{if(yy>200){doc.addPage();BG();yy=16}const p=pts(t);
      T(hhmm(t.et||t.sig_t),c2[0],yy);T((t.man?'Propia ':'')+SETN[t.st],c2[1],yy);T(t.d==='L'?'Largo':'Corto',c2[2],yy,{c:t.d==='L'?GR:RD});
      T(f(t.e),c2[3],yy);T(f(t.sl),c2[4],yy);T(f(t.tp),c2[5],yy);T(t.why||'abierta',c2[6],yy,{c:MU});T(f(t.x),c2[7],yy);
      T(p==null?'-':sgn(p.toFixed(1)),c2[8],yy,{c:p>0?GR:p<0?RD:MU});T(t.r==null?'-':sgn(t.r.toFixed(2))+'R',c2[9],yy,{c:t.r>0?GR:t.r<0?RD:MU});yy+=6});
    const cl=dt.filter(t=>t.x!=null),s=stats(cl);
    if(cl.length){yy+=2;T(`Resumen del día: ${s.n} operaciones · ${s.wr.toFixed(0)}% acierto · ${sgn(s.sum.toFixed(2))}R · ${sgn(s.pt.toFixed(1))} puntos`,14,yy,{b:1,c:s.sum>=0?GR:RD})}
  }
  selId=keepSel;compute();goDay(keepDay);$('pProg').textContent='';
  const name=`ScannerIB_${S.key}_${from}_${to}.pdf`,blob=doc.output('blob'),file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name})}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
  toast('✓ Informe generado')}

$('pdf').onclick=()=>{if(!window.jspdf){toast('Abre la app con conexión una vez para poder generar PDF');return}
  const ds=allDates();['pFrom','pTo'].forEach(id=>{$(id).min=ds[0];$(id).max=ds[ds.length-1]});
  $('pFrom').value=$('pTo').value=S.days[day];$('pInfo').textContent=`${S.label} · datos del ${ds[0]} al ${ds[ds.length-1]}. Los días de más de 60 días salen sin gráfico.`;
  $('mPdf').classList.add('show')};
$('pdfX').onclick=()=>$('mPdf').classList.remove('show');
$('pGo').onclick=async()=>{const a=$('pFrom').value,b=$('pTo').value;if(!a||!b||a>b){toast('Revisa las fechas');return}
  busy=true;$('pGo').disabled=true;try{await makePDF(a,b)}catch(e){toast('Error al generar el PDF');console.error(e)}
  busy=false;$('pGo').disabled=false;$('mPdf').classList.remove('show')};

/* ---------- Botones ---------- */
$('info').onclick=()=>$('mInfo').classList.add('show');
$('infoX').onclick=()=>$('mInfo').classList.remove('show');
$('mInfo').onclick=e=>{if(e.target.id==='mInfo')$('mInfo').classList.remove('show')};
$('sym').onchange=()=>pick(true);
['fA','fB','fC','fD','fL','fS','fN','am','rr','ib','gap','fO','fM'].forEach(id=>$(id).onchange=compute);
$('fV').onchange=()=>vw.applyOptions({visible:$('fV').checked});
$('prev').onclick=()=>goDay(day-1);
$('next').onclick=()=>goDay(day+1);
$('fit').onclick=()=>goDay(day);
$('rel').onclick=async()=>{if(!navigator.onLine){toast('Sin conexión: se mantienen los últimos datos');return}
  $('relI').classList.add('spin');const r=await load(true);$('relI').classList.remove('spin');
  toast(r==='new'?'✓ Datos nuevos ('+D.updated+')':r==='same'?'Sin cambios desde '+D.updated:'No se pudieron descargar los datos')};
$('tb').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;const t=TR[+tr.dataset.i];select(t);
  if(t.di<0){toast('Sin velas para este día (más de 60 días)');return}
  goDay(t.di);$('wrap').scrollIntoView({behavior:'smooth',block:'center'})};
$('exp').onclick=()=>{const b=new Blob([JSON.stringify({v:2,ov:OV,man:MAN},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ib_ajustes.json';a.click()};
$('imp').onchange=e=>{const fl=e.target.files[0];if(!fl)return;
  fl.text().then(s=>{try{const j=JSON.parse(s);if(j.v===2){Object.assign(OV,j.ov||{});Object.assign(MAN,j.man||{})}else Object.assign(OV,j);compute();toast('✓ Importado')}catch(err){alert('Archivo no válido')}});e.target.value=''};
saveAll();load(false);setInterval(()=>{if(navigator.onLine)load(true)},120000);
window.addEventListener('online',()=>load(true));requestAnimationFrame(loop);
</script></body></html>
