name: Scanner IB
on:
  schedule:
    - cron: '*/15 7-21 * * 1-5'   # respaldo; el disparo principal es cron-job.org
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-ib
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests
      - name: Escanear y guardar datos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3; do
            python scanner_ib.py
            git add data.json state.json history.json
            git commit -m "Datos IB" || exit 0
            if git push; then exit 0; fi
            # Otra ejecución guardó datos a la vez: se toma su versión y se recalcula encima
            echo "Conflicto al guardar, reintento $intento"
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
